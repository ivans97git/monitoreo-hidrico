<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Monitoreo Hidrológico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="loadingScreen" class="loading-screen">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Cargando...</span>
        </div>
        <p class="mt-3">Cargando sistema...</p>
    </div>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="fas fa-water me-2"></i>
                Monitoreo Hidrológico
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <span class="nav-link">
                            <i class="fas fa-user me-1"></i>
                            <span id="userName">Usuario</span>
                        </span>
                    </li>
                    <li class="nav-item">
                        <button class="btn btn-outline-light btn-sm ms-2" onclick="logout()">
                            <i class="fas fa-sign-out-alt me-1"></i> Salir
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid main-container">
        <div class="row">
            <div class="col-md-3 sidebar">
                <ul class="nav nav-tabs" id="mainTabs" role="tablist">
                    <li class="nav-item">
                        <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#mediciones">
                            <i class="fas fa-edit me-1"></i> Registrar
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#graficos">
                            <i class="fas fa-chart-line me-1"></i> Gráficos
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#alertas">
                            <i class="fas fa-exclamation-triangle me-1"></i> Alertas
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#contactos">
                            <i class="fas fa-users me-1"></i> Contactos
                        </button>
                    </li>
                </ul>

                <div class="tab-content p-3">
                    <div class="tab-pane fade show active" id="mediciones">
                        <h6 class="mb-3">Registrar Medición</h6>
                        <form id="formMedicion">
                            <div class="mb-3">
                                <label class="form-label">Estación</label>
                                <select class="form-select" id="selectEstacion" required>
                                    <option value="">Seleccionar...</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Tipo</label>
                                <select class="form-select" id="selectTipo" required>
                                    <option value="">Seleccionar...</option>
                                    <option value="nivel_rio">Nivel de Río (m)</option>
                                    <option value="precipitacion">Precipitación (mm)</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Valor</label>
                                <input type="number" class="form-control" id="inputValor" step="0.01" min="0" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Observaciones</label>
                                <textarea class="form-control" id="inputObservaciones" rows="3"></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="fas fa-save me-1"></i> Registrar
                            </button>
                        </form>
                        <div id="mensajeRegistro" class="mt-3"></div>
                    </div>

                    <div class="tab-pane fade" id="graficos">
                        <h6 class="mb-3">Historial</h6>
                        <select class="form-select mb-3" id="selectEstacionGrafico">
                            <option value="">Todas las estaciones</option>
                        </select>
                        <canvas id="graficoMediciones" height="300"></canvas>
                        <button class="btn btn-sm btn-outline-primary mt-3" onclick="actualizarGrafico()">
                            <i class="fas fa-sync me-1"></i> Actualizar
                        </button>
                    </div>

                    <div class="tab-pane fade" id="alertas">
                        <h6 class="mb-3">Alertas Recientes</h6>
                        <div id="listaAlertas" class="list-group"></div>
                    </div>

                    <div class="tab-pane fade" id="contactos">
                        <h6 class="mb-3">Gestionar Contactos</h6>
                        <form id="formContacto" class="mb-3">
                            <div class="mb-2">
                                <input type="text" class="form-control" id="contactoNombre" placeholder="Nombre" required>
                            </div>
                            <div class="mb-2">
                                <input type="tel" class="form-control" id="contactoTelefono" placeholder="Teléfono (con código país)" required>
                            </div>
                            <div class="mb-2">
                                <select class="form-select" id="contactoEstacion" required>
                                    <option value="">Seleccionar estación...</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-success w-100">
                                <i class="fas fa-plus me-1"></i> Agregar Contacto
                            </button>
                        </form>
                        <div id="listaContactos"></div>
                    </div>
                </div>
            </div>

            <div class="col-md-9 map-container">
                <div id="map"></div>
                <div class="map-legend">
                    <h6>Leyenda</h6>
                    <div><span class="badge bg-success">●</span> Normal</div>
                    <div><span class="badge bg-warning">●</span> Alerta</div>
                    <div><span class="badge bg-danger">●</span> Crítico</div>
                </div>
                <div id="estacionInfo" class="station-info" style="display: none;"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/mapa.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/graficos.js"></script>
</body>
</html>
